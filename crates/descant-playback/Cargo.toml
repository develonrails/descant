[package]
name = "descant-playback"
description = "Descant's playback engine: librespot driven through Spirc, guarded against its failure modes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
descant-core = { path = "../descant-core" }
librespot-core = { workspace = true }
librespot-playback = { workspace = true }
librespot-connect = { workspace = true }
librespot-metadata = { workspace = true }
# the versions librespot's own PulseAudio backend was built with
libpulse-binding = { version = "2.30.1", default-features = false }
libpulse-simple-binding = { version = "2.29.0", default-features = false }
log = "0.4"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
